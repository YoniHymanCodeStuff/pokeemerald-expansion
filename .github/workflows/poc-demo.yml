name: Build region demo

on:
  workflow_dispatch:
  push:
    branches: [poc-demo]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3
      - name: Compile demo
        run: make -j2
      - name: Package playable build
        run: |
          mkdir demo
          cp pokeemerald.gba demo/pokemon-region-demo-v0.1.gba
          cp POC.md demo/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-region-demo-v0.1
          path: demo/
          if-no-files-found: error
          retention-days: 30
