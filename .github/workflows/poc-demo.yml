name: Build hometown opening

on:
  workflow_dispatch:
  push:
    branches: [poc-demo, leg-one]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3
      - name: Compile demo
        run: make -j2
      - name: Package playable build
        run: |
          mkdir demo
          cp pokeemerald.gba demo/pokemon-leg-one-v0.2.gba
          cp docs/our-game/PLAYTEST.md demo/README.md
          cp docs/our-game/Leg-One-Dialogue.txt demo/Leg-One-Dialogue.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-leg-one-v0.2
          path: demo/
          if-no-files-found: error
          retention-days: 30
